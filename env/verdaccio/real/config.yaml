# Verdaccio (real registry) for Ghostkey. Based on the official verdaccio 5 docker config.
# Differences from the default:
#   - NO uplinks and NO proxy settings on packages (the default would call registry.npmjs.org).
#   - The "audit" middleware is removed (it forwards to an uplink).
#   - htpasswd lives in the storage volume, so Verdaccio never writes into this bind-mounted folder.

storage: /verdaccio/storage/data
plugins: /verdaccio/plugins

# Web UI is not needed for the demo.
web:
  enable: false

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    # Registration must stay open: env/setup.sh creates the users with
    # PUT /-/user/org.couchdb.user:<name>. The network is internal, so this is safe.
    max_users: 100

packages:
  # Only release-bot may publish or unpublish. ci-bot (token REAL-CI-01) only installs; its baseline says
  # may_publish: false. So when scenario 2 uses a stolen ci-bot token to publish, the registry refuses (403).
  # Ghostkey still detects the attempt: the request reaches this registry through the gateway and is logged
  # as an unexpected_publish with result=denied.
  # Private scope: you must be logged in to read.
  '@kfu/*':
    access: $authenticated
    publish: release-bot
    unpublish: release-bot
  # Everything else: same rules. There is no uplink, so unknown packages are simply 404.
  '**':
    access: $authenticated
    publish: release-bot
    unpublish: release-bot

server:
  keepAliveTimeout: 60

log: { type: stdout, format: pretty, level: http }
